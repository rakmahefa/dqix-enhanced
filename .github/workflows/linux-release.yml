name: Linux launcher and release

on:
  push:
    branches:
      - upstream-dev
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - upstream-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-tests:
    name: Recompiler semantic tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the supported ARM test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld llvm
          clang --version

      - name: Run ARM and Thumb semantic tests
        run: python3 tests/semantics/run.py 2000

  build:
    needs: semantic-tests
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential g++ make pkg-config \
            libsdl2-dev libgl-dev \
            python3 python3-pip python3-venv \
            xvfb xauth

      - name: Verify runner architecture
        run: |
          case "${{ matrix.arch }}" in
            x86_64) test "$(uname -m)" = "x86_64" ;;
            arm64)  test "$(uname -m)" = "aarch64" ;;
          esac
          python3 --version
          make --version
          pkg-config --modversion sdl2

      - name: Check Python and shell syntax
        run: |
          python3 -m compileall -q recomp tools tests
          sh -n tools/play.sh

      - name: Restore payload download cache
        uses: actions/cache@v4
        with:
          path: build/payload-cache
          key: dqix-linux-payload-${{ matrix.arch }}-python-3.12.15-pyyaml-6.0.2

      - name: Build portable source and runtime payload
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA:0:12}"
          fi
          python3 tools/launcher/payload.py \
            --repo "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/build/payload" \
            --version "$VERSION"

      - name: Compile native launcher
        run: make launcher PAYLOAD="$GITHUB_WORKSPACE/build/payload"

      - name: Verify launcher CLI
        run: |
          build/launcher/dqix-launcher --version
          build/launcher/dqix-launcher --help

      - name: Render launcher screenshots under Xvfb
        run: |
          mkdir -p build/launcher-screenshots
          xvfb-run -a build/launcher/dqix-launcher \
            --preview "$GITHUB_WORKSPACE/build/launcher-screenshots"

      - name: Run packaging, payload and screenshot tests
        env:
          DQIX_PAYLOAD_DIR: ${{ github.workspace }}/build/payload
          DQIX_LAUNCHER_SCREENSHOTS: ${{ github.workspace }}/build/launcher-screenshots
        run: python3 -m unittest discover -s tests/packaging -v

      - name: Package launcher and payload release archive
        run: make release PAYLOAD="$GITHUB_WORKSPACE/build/payload"

      - name: Upload Linux release archive and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqix-linux-${{ matrix.arch }}
          path: |
            build/release/DQIX-Enhanced-*.tar.gz
            build/release/SHA256SUMS-Linux-*.txt
            build/launcher-screenshots/*.bmp
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dqix-linux-*
          path: artifacts

      - name: Prepare release files and checksums
        run: |
          mkdir -p release
          find artifacts -type f -name 'DQIX-Enhanced-*.tar.gz' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DQIX Enhanced ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS.txt
