name: Publish Linux AppImage

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful run ID of “Linux CI + AppImage” on main or stable
        required: true
        type: string
      tag_name:
        description: New, unused release tag
        required: true
        type: string
      release_name:
        description: Name shown on the GitHub Release
        required: true
        default: DQIX Enhanced Linux Builder
        type: string
      dry_run:
        description: Run read-only preflight without creating a tag or release (safe default)
        required: true
        type: boolean
        default: true

# Default to read-only. Only the explicit publish job receives contents: write.
permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Read-only provenance and artifact preflight
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      head_sha: ${{ steps.source.outputs.head_sha }}
      head_branch: ${{ steps.source.outputs.head_branch }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      artifact_digest: ${{ steps.source.outputs.artifact_digest }}
    steps:
      - name: Check out read-only verification helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate source run, artifact provenance, and unused tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG_NAME: ${{ inputs.tag_name }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: bash .github/scripts/validate-release-source.sh

      - name: Download and verify exact artifact archive
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: bash .github/scripts/verify-appimage-artifact.sh

      - name: Finish read-only dry run
        if: ${{ inputs.dry_run }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          echo "DRY RUN PASSED: validated source commit $SOURCE_SHA and artifact $ARTIFACT_ID."
          echo "No tag or release was created. Set dry_run=false in a deliberate manual dispatch to publish."

  publish:
    name: Publish verified artifact (explicit opt-in only)
    if: ${{ inputs.dry_run == false }}
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out read-only verification helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Revalidate source run and ensure tag is still unused
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG_NAME: ${{ inputs.tag_name }}
          WORKFLOW_REF: ${{ github.ref }}
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
        shell: bash
        run: bash .github/scripts/validate-release-source.sh

      - name: Re-download and verify artifact immediately before publication
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: bash .github/scripts/verify-appimage-artifact.sh

      - name: Create a new tag and release without overwriting existing refs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          ASSETS_DIR: ${{ steps.artifact.outputs.assets_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # Creating a Git ref is atomic and fails if the tag already exists.
          # Never use force-update and never retarget an existing tag.
          TAG_JSON="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG_NAME" -f "sha=$HEAD_SHA")"
          CREATED_SHA="$(jq -r '.object.sha // empty' <<< "$TAG_JSON")"
          [ "$CREATED_SHA" = "$HEAD_SHA" ] || {
            echo "Created tag does not point to the verified source SHA" >&2
            exit 1
          }

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## DQIX Enhanced Linux Builder

          This AppImage contains the builder and public source payload. It does not contain a ROM or a prebuilt game.

          Built from commit: $HEAD_SHA

          The complete game is generated locally using a ROM supplied by its owner. Keep that ROM, saves, generated code, and workspace private.

          Verify the downloaded AppImage with SHA256SUMS.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSETS_DIR/DQIX-Enhanced-Builder-x86_64.AppImage" \
            "$ASSETS_DIR/SHA256SUMS" \
            "$ASSETS_DIR/build-info.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md"
